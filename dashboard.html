<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Inventory System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: .75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .nav-brand { font-weight: 700; color: #f1f5f9; font-size: 1rem; }
    .nav-user  { font-size: .8rem; color: #94a3b8; margin-left: auto; }
    #adminLinks { display: none; gap: .75rem; }
    .nav-link {
      font-size: .8rem;
      color: #94a3b8;
      text-decoration: none;
      padding: .3rem .6rem;
      border-radius: 6px;
      transition: background .15s, color .15s;
    }
    .nav-link:hover, .nav-link.active { background: #334155; color: #f1f5f9; }
    #logoutBtn {
      font-size: .8rem;
      color: #94a3b8;
      background: none;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: .3rem .75rem;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    #logoutBtn:hover { background: #334155; color: #f1f5f9; }

    /* ── Layout ── */
    main {
      flex: 1;
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    .refresh-bar {
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .refresh-label {
      font-size: .75rem;
      color: #64748b;
    }
    #refreshBadge {
      font-size: .75rem;
      font-weight: 700;
      color: #3b82f6;
      min-width: 2.5rem;
    }
    #refreshNowBtn {
      font-size: .75rem;
      background: none;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #94a3b8;
      padding: .25rem .6rem;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    #refreshNowBtn:hover { background: #334155; color: #f1f5f9; }

    /* ── Banners ── */
    #loadingBanner {
      display: none;
      align-items: center;
      gap: .5rem;
      font-size: .8rem;
      color: #64748b;
      margin-bottom: 1rem;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #errorBanner {
      display: none;
      background: #1f0a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      font-size: .85rem;
      padding: .75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    /* ── Stat cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 860px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr 1fr; } }

    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem;
    }
    .stat-label {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #64748b;
      margin-bottom: .5rem;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: #f1f5f9;
      line-height: 1;
    }
    .stat-card.accent-green  .stat-value { color: #86efac; }
    .stat-card.accent-yellow .stat-value { color: #fde68a; }
    .stat-card.accent-purple .stat-value { color: #c4b5fd; }

    /* ── Content grid ── */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.5rem;
    }
    @media (max-width: 900px) {
      .content-grid { grid-template-columns: 1fr; }
    }

    /* ── Card ── */
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem;
    }
    .card-title {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #64748b;
      margin-bottom: 1rem;
    }

    /* ── Checked-out table ── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
    }
    .data-table th {
      text-align: left;
      padding: .5rem .75rem;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #64748b;
      border-bottom: 1px solid #334155;
    }
    .data-table td {
      padding: .6rem .75rem;
      border-bottom: 1px solid #1e293b;
      color: #cbd5e1;
      vertical-align: middle;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #0f172a; }
    .empty-cell {
      text-align: center;
      color: #475569;
      font-size: .8rem;
      padding: 2rem !important;
    }
    .mono { font-size: .75rem; color: #64748b; font-family: monospace; }

    /* ── Activity list ── */
    #activityList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      max-height: 500px;
      overflow-y: auto;
    }
    .history-empty {
      font-size: .8rem;
      color: #475569;
      text-align: center;
      padding: 2rem 0;
    }
    .history-item {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: .6rem .75rem;
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      gap: .15rem .5rem;
    }
    .history-badge {
      grid-row: 1;
      font-size: .65rem;
      font-weight: 700;
      padding: .15rem .45rem;
      border-radius: 4px;
      color: #fff;
      white-space: nowrap;
      align-self: center;
    }
    .history-name {
      grid-row: 1;
      font-size: .8rem;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-detail {
      grid-column: 1 / -1;
      font-size: .72rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

<nav>
  <span class="nav-brand">&#9646;&#9646;&#9646; Inventory</span>
  <div id="adminLinks">
    <a href="dashboard.html"   class="nav-link active">Dashboard</a>
    <a href="items-admin.html" class="nav-link">Items</a>
    <a href="reports.html"     class="nav-link">Reports</a>
  </div>
  <a href="scanner.html" class="nav-link" style="margin-left:auto">Scanner</a>
  <span class="nav-user">Signed in as <strong id="userLabel"></strong></span>
  <button id="logoutBtn">Sign out</button>
</nav>

<main>
  <div class="page-header">
    <h1 class="page-title">Dashboard</h1>
    <div class="refresh-bar">
      <span class="refresh-label">Auto-refresh in</span>
      <span id="refreshBadge">30s</span>
      <button id="refreshNowBtn">Refresh now</button>
    </div>
  </div>

  <div id="loadingBanner">
    <div class="spinner"></div>
    Loading…
  </div>
  <div id="errorBanner"></div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Items</div>
      <div class="stat-value" id="statTotalItems">—</div>
    </div>
    <div class="stat-card accent-green">
      <div class="stat-label">Total Quantity</div>
      <div class="stat-value" id="statTotalQty">—</div>
    </div>
    <div class="stat-card accent-yellow">
      <div class="stat-label">Checked Out</div>
      <div class="stat-value" id="statCheckedOut">—</div>
    </div>
    <div class="stat-card accent-purple">
      <div class="stat-label">Available</div>
      <div class="stat-value" id="statAvailable">—</div>
    </div>
  </div>

  <!-- Content -->
  <div class="content-grid">
    <!-- Checked-out items -->
    <div class="card">
      <div class="card-title">Checked-out Items</div>
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Barcode</th>
            <th>With</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody id="checkedOutBody">
          <tr><td colspan="4" class="empty-cell">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Activity feed -->
    <div class="card">
      <div class="card-title">Recent Activity</div>
      <ul id="activityList">
        <li class="history-empty">Loading…</li>
      </ul>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
