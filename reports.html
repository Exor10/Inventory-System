<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — Inventory System</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: .75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .nav-brand { font-weight: 700; color: #f1f5f9; font-size: 1rem; }
    .nav-user  { font-size: .8rem; color: #94a3b8; }
    #adminLinks { display: none; gap: .75rem; }
    .nav-link {
      font-size: .8rem;
      color: #94a3b8;
      text-decoration: none;
      padding: .3rem .6rem;
      border-radius: 6px;
      transition: background .15s, color .15s;
    }
    .nav-link:hover, .nav-link.active { background: #334155; color: #f1f5f9; }
    #logoutBtn {
      font-size: .8rem;
      color: #94a3b8;
      background: none;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: .3rem .75rem;
      cursor: pointer;
      transition: background .15s, color .15s;
      margin-left: auto;
    }
    #logoutBtn:hover { background: #334155; color: #f1f5f9; }

    /* ── Layout ── */
    main {
      flex: 1;
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-right: auto;
    }
    .date-label {
      font-size: .8rem;
      color: #64748b;
      white-space: nowrap;
    }
    input[type="date"] {
      padding: .5rem .75rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: .85rem;
      outline: none;
      transition: border-color .15s;
      color-scheme: dark;
    }
    input[type="date"]:focus { border-color: #3b82f6; }
    .btn-primary {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .5rem 1rem;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-primary:disabled { opacity: .5; cursor: default; }
    .btn-secondary {
      background: none;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: .5rem 1rem;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .btn-secondary:hover { background: #1e293b; color: #f1f5f9; }

    /* ── Banners ── */
    #loadingBanner {
      display: none;
      align-items: center;
      gap: .5rem;
      font-size: .8rem;
      color: #64748b;
      margin-bottom: 1rem;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #errorBanner {
      display: none;
      background: #1f0a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      font-size: .85rem;
      padding: .75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    /* ── Summary cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 560px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem 1.25rem;
    }
    .stat-label {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #64748b;
      margin-bottom: .4rem;
    }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      color: #f1f5f9;
      line-height: 1;
    }
    .stat-card.c-green  .stat-value { color: #86efac; }
    .stat-card.c-orange .stat-value { color: #fdba74; }
    .stat-card.c-purple .stat-value { color: #c4b5fd; }
    .stat-card.c-sky    .stat-value { color: #7dd3fc; }

    /* ── Content grid ── */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 1.5rem;
    }
    @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.25rem;
    }
    .card-title {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #64748b;
      margin-bottom: 1rem;
    }

    /* ── Chart ── */
    .chart-wrap {
      position: relative;
      height: 300px;
    }

    /* ── Top items table ── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
    }
    .data-table th {
      text-align: left;
      padding: .5rem .75rem;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #64748b;
      border-bottom: 1px solid #334155;
    }
    .data-table td {
      padding: .6rem .75rem;
      border-bottom: 1px solid #0f172a;
      color: #cbd5e1;
      vertical-align: middle;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .empty-cell {
      text-align: center;
      color: #475569;
      font-size: .8rem;
      padding: 2.5rem !important;
    }
    .rank-cell { color: #475569; font-size: .8rem; width: 2rem; text-align: center; }
    .name-cell { font-weight: 600; color: #f1f5f9; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-cell  { width: 160px; }
    .bar-wrap  { display: flex; align-items: center; gap: .5rem; }
    .bar-fill  {
      height: 8px;
      background: #3b82f6;
      border-radius: 4px;
      min-width: 2px;
      transition: width .3s;
    }
    .bar-label { font-size: .75rem; color: #94a3b8; white-space: nowrap; }
  </style>
</head>
<body>

<nav>
  <span class="nav-brand">&#9646;&#9646;&#9646; Inventory</span>
  <div id="adminLinks">
    <a href="dashboard.html"   class="nav-link">Dashboard</a>
    <a href="items-admin.html" class="nav-link">Items</a>
    <a href="reports.html"     class="nav-link active">Reports</a>
  </div>
  <a href="scanner.html" class="nav-link">Scanner</a>
  <span class="nav-user">Signed in as <strong id="userLabel"></strong></span>
  <button id="logoutBtn">Sign out</button>
</nav>

<main>
  <div class="toolbar">
    <h1 class="page-title">Reports</h1>
    <span class="date-label">From</span>
    <input type="date" id="dateFrom">
    <span class="date-label">To</span>
    <input type="date" id="dateTo">
    <button class="btn-primary" id="loadBtn">Load</button>
    <button class="btn-secondary" id="exportCsvBtn">&#8659; Export CSV</button>
  </div>

  <div id="loadingBanner">
    <div class="spinner"></div>
    Loading…
  </div>
  <div id="errorBanner"></div>

  <!-- Summary cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Movements</div>
      <div class="stat-value" id="statTotal">—</div>
    </div>
    <div class="stat-card c-green">
      <div class="stat-label">Units In</div>
      <div class="stat-value" id="statIn">—</div>
    </div>
    <div class="stat-card c-orange">
      <div class="stat-label">Units Out</div>
      <div class="stat-value" id="statOut">—</div>
    </div>
    <div class="stat-card c-purple">
      <div class="stat-label">Check Out</div>
      <div class="stat-value" id="statCheckout">—</div>
    </div>
    <div class="stat-card c-sky">
      <div class="stat-label">Check In</div>
      <div class="stat-value" id="statCheckin">—</div>
    </div>
  </div>

  <!-- Chart + Top Items -->
  <div class="content-grid">
    <div class="card">
      <div class="card-title">Movements per Day</div>
      <div class="chart-wrap">
        <canvas id="movementsChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Top 10 Most-Moved Items</div>
      <table class="data-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Item</th>
            <th>Movements</th>
          </tr>
        </thead>
        <tbody id="topItemsBody">
          <tr><td colspan="3" class="empty-cell">Select a date range and click Load</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
